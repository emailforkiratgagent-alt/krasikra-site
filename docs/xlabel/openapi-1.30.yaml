      description: '**Удалено в версии 1.5** (в более поздних версиях — `404`).'
      security:
        - appToken: []
          bearerAuth: []
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: array
                    items:
                      $ref: '#/components/schemas/PollQuestion'
                required:
                  - response
        '401':
          description: 'Не авторизован: нет/неверный `X-APP-TOKEN` или `Authorization`, токен просрочен, пользователь заблокирован или удалён'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /receipt_rate/rate:
    post:
      tags:
        - Опросы и оценка чеков
      summary: Оценить чек
      description: |-
        Ответы на обязательные вопросы опроса обязательны.

        Особый случай: Чек уже оценён / не хватает ответов  — сервер отвечает `200` с телом `{"error": ...}`.
      security:
        - appToken: []
          bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                receipt_id:
                  type: string
                  description: UUID чека
                poll_id:
                  type: integer
                rates:
                  type: array
                  items:
                    type: object
                    properties:
                      question_id:
                        type: integer
                      value:
                        description: Ответ (тип зависит от виджета вопроса)
                    required:
                      - question_id
                      - value
              required:
                - receipt_id
                - rates
      responses:
        '200':
          description: Благодарность
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: string
                required:
                  - response
        '400':
          description: Некорректные `rates`/`poll_id`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 'Не авторизован: нет/неверный `X-APP-TOKEN` или `Authorization`, токен просрочен, пользователь заблокирован или удалён'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Чек/опрос не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /smm/account_levels:
    get:
