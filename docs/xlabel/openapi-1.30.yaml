  /smm/instagram/redirect:
    get:
      tags:
        - SMM
      summary: Редирект на авторизацию Instagram
      description: Принимает любой HTTP-метод. Возвращает `302` на Instagram OAuth либо HTML-заглушку, если Instagram не настроен.
      security:
        - appToken: []
      responses:
        '200':
          description: HTML-заглушка
          content:
            text/html:
              schema:
                type: string
        '401':
          description: Не указан или неверен `X-APP-TOKEN`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /smm/instagram/authorize:
    post:
      tags:
        - SMM
      summary: Привязать Instagram по коду OAuth
      security:
        - appToken: []
          bearerAuth: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                code:
                  type: string
              required:
                - code
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
              required:
                - code
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    $ref: '#/components/schemas/People'
                required:
                  - response
        '400':
          description: Нет `code`, SMM отключён/заблокирован для пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 'Не авторизован: нет/неверный `X-APP-TOKEN` или `Authorization`, токен просрочен, пользователь заблокирован или удалён'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: Ответ Instagram некорректен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /smm/instagram/deauthorize:
    post:
      tags:
        - SMM
      summary: Отвязать Instagram
      security:
        - appToken: []
          bearerAuth: []
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    $ref: '#/components/schemas/People'
                required:
                  - response
        '401':
          description: 'Не авторизован: нет/неверный `X-APP-TOKEN` или `Authorization`, токен просрочен, пользователь заблокирован или удалён'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /smm/instagram/media:
    get:
      tags:
        - SMM
      summary: Список медиа пользователя для чека
      security:
        - appToken: []
          bearerAuth: []
      parameters:
        - name: receipt_id
          in: query
          required: true
          schema:
            type: string
          description: UUID чека
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        url:
                          type: string
                required:
                  - response
        '400':
          description: Нет `receipt_id` / нет аккаунта / нужна повторная авторизация / неподходящее время
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 'Не авторизован: нет/неверный `X-APP-TOKEN` или `Authorization`, токен просрочен, пользователь заблокирован или удалён'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Чек не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: Instagram недоступен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - SMM
      summary: Привязать пост к чеку
      security:
        - appToken: []
          bearerAuth: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                media_id:
                  type: string
                receipt_id:
                  type: string
              required:
                - media_id
                - receipt_id
          application/json:
            schema:
              type: object
              properties:
                media_id:
                  type: string
                receipt_id:
                  type: string
              required:
                - media_id
                - receipt_id
      responses:
        '200':
          description: Сообщение об успешной привязке
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: string
                required:
                  - response
        '400':
          description: Нет параметров / пост уже привязан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 'Не авторизован: нет/неверный `X-APP-TOKEN` или `Authorization`, токен просрочен, пользователь заблокирован или удалён'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Чек не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /smm/block/receipt:
    post:
      tags:
        - SMM
      summary: Временно заблокировать чек под публикацию
      security:
        - appToken: []
          bearerAuth: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                receipt_id:
                  type: string
              required:
                - receipt_id
          application/json:
            schema:
              type: object
              properties:
                receipt_id:
                  type: string
              required:
                - receipt_id
      responses:
        '200':
          description: Время блокировки, сек.
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: integer
                required:
                  - response
        '400':
          description: Нет `receipt_id` / нет аккаунта
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 'Не авторизован: нет/неверный `X-APP-TOKEN` или `Authorization`, токен просрочен, пользователь заблокирован или удалён'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Чек не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /smm/block/receipt/confirm:
    post:
      tags:
        - SMM
      summary: Подтвердить блокировку чека
      security:
        - appToken: []
          bearerAuth: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                receipt_id:
                  type: string
              required:
                - receipt_id
          application/json:
            schema:
              type: object
              properties:
                receipt_id:
                  type: string
              required:
                - receipt_id
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: string
                required:
                  - response
        '400':
          description: Нет `receipt_id`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 'Не авторизован: нет/неверный `X-APP-TOKEN` или `Authorization`, токен просрочен, пользователь заблокирован или удалён'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Чек/блокировка не найдены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    appToken:
      type: apiKey
      in: header
      name: X-APP-TOKEN
      description: Токен приложения (проекта) в виде `Bearer <app_token>`. Нужен для всех методов.
    bearerAuth:
      type: http
      scheme: bearer
      description: 'access_token пользователя из `/token/*`. Заголовок `Authorization: Bearer <access_token>`.'
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error
      description: Формат ошибки. Тексты сообщений — на русском/английском, как возвращает сервер.
    TokenPair:
      type: object
      properties:
        access_token:
          type: string
        expires_in:
          type: integer
          description: Время жизни access_token, сек.
        token_type:
          type: string
          example: bearer
        refresh_token:
          type: string
      required:
        - access_token
        - expires_in
        - token_type
        - refresh_token
    MessengerStart:
      type: object
      properties:
        id_token:
          type: string
          description: Одноразовый токен; затем передаётся в соответствующий метод `/token/{provider}`. Для `/people/phone/verify/telegram/start` поле называется `token`.
        expires_in:
          type: integer
        token_type:
          type: string
          enum:
            - telegram
            - whatsapp
            - max
        url:
          type: string
          description: Deep-link в мессенджер (`tg://`, `https://wa.me/…`, `https://max.ru/…`)
      required:
        - id_token
        - expires_in
        - token_type
        - url
    People:
      type: object
      properties:
        id:
          type: number
        mobile_phone:
          type: string
        email:
          type: string
        instagram_user_id:
          type: string
        instagram_user_name:
          type: string
        instagram_need_auth:
          type: boolean
          description: Нужна повторная авторизация Instagram
        favorite_store:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
          description: С v1.3
        pos_print_check:
          type: string
          enum:
            - always
            - never
          description: С v1.28. Только если в проекте печать чека настраивается в профиле.
      required:
        - id
    Account:
      type: object
      properties:
        id:
          type: integer
        balance:
          type: integer
        level_name:
          type: string
        subtitle:
          type: string
        level_rate:
          type: number
        next_level_name:
          type: string
        next_level_condition:
          type: number
          description: Сколько осталось набрать до следующего уровня
        can_have_social_bonus:
          type: boolean
        updated_at:
          type: string
          format: date-time
          description: С v1.2
        time_limited_bonuses:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              balance:
                type: number
              date_to:
                type: string
                format: date-time
              expired:
                type: boolean
            description: С v1.2
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'
        expiring_bonuses:
          type: object
          additionalProperties: true
          description: С v1.3. Сгорающие бонусы (в ближайшие дни)
      required:
        - id
        - balance
        - can_have_social_bonus
    Transaction:
      type: object
      properties:
        id:
          type: integer
        account_id:
          type: integer
        time:
          type: string
          format: date-time
        debit_summ:
          type: number
        credit_summ:
          type: number
        store_id:
          type: integer
        reason_logo_uri:
          type: string
        receipt_id:
          type: string
          description: UUID чека
        receipt_rated:
          type: boolean
        social_level_id:
          type: integer
        social_bonus:
          type: number
        social_bonus_not_after:
          type: string
          format: date-time
    Advert:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        date_from:
          type: string
          format: date-time
        date_to:
          type: string
          format: date-time
        description:
          type: string
        index_image_uri:
          type: string
        image_uri:
          type: string
        viewed_at:
          type: string
          format: date-time
          description: Только для авторизованного пользователя, если просмотрено
      required:
        - id
        - name
    AdvertCounter:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        subtitle:
          type: string
        date_from:
          type: string
          format: date-time
        date_to:
          type: string
          format: date-time
        content_uri:
          type: string
        stages:
          type: array
          items:
            type: object
            properties:
              progress_description:
                type: string
              gift_description:
                type: string
              image_url:
                type: string
              score:
                type: integer
        repeatable:
          type: boolean
        iteration:
          type: integer
        current_progress:
          type: integer
      required:
        - id
        - title
    Banner:
      type: object
      properties:
        id:
          type: integer
        date_from:
          type: string
          format: date-time
        date_to:
          type: string
          format: date-time
        timeout:
          type: integer
          description: Часы до повторного показа
        uri:
          type: string
      required:
        - id
        - uri
    News:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        date:
          type: string
          format: date-time
        text:
          type: string
        image_uri:
          type: string
        viewed_at:
          type: string
          format: date-time
      required:
        - id
        - title
        - date
        - text
    Coupon:
      type: object
      properties:
        id:
          type: string
          description: Идентификатор (UUID или число для групповых купонов)
        date_from:
          type: string
          format: date-time
        date_to:
          type: string
          format: date-time
        active:
          type: boolean
        type_name:
          type: string
        description:
          type: string
        image_uri:
          type: string
        viewed_at:
          type: string
          format: date-time
        stores:
          type: array
          items:
            type: integer
        target:
          type: string
          enum:
            - order
            - receipt
          description: С v1.22
        details:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              product_id:
                type: integer
              kind:
                type: string
              value: {}
              count_max:
                type: integer
              priority:
                type: integer
      required:
        - id
        - date_from
        - date_to
        - active
        - type_name
    Store:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        city:
          type: string
        address:
          type: string
        phone:
          type: string
        work_times:
          type: string
        coordinates:
          type: array
          items:
            type: number
          description: '[lat, lng]'
        priority:
          type: integer
          description: С v1.12
        use_products:
          type: boolean
          description: С v1.20
        use_orders:
          type: boolean
          description: С v1.20
        deny_pickup:
          type: boolean
          description: С v1.23
        city_guid:
          type: string
          description: С v1.30
        working_hours:
          type: object
          description: С v1.30. Ключ — день недели.
          additionalProperties:
            type: object
            properties:
              start:
                type: string
                example: '09:00'
              end:
                type: string
              break_start:
                type: string
              break_end:
                type: string
        additional_info:
          type: string
          description: С v1.30
        timezone:
          description: С v1.30. Смещение часового пояса
      required:
        - id
    ProductGroup:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        priority:
          type: integer
        image_uri:
          type: string
        children:
          type: array
          items:
            type: integer
      required:
        - id
        - name
    Product:
      type: object
      properties:
        id:
          type: integer
        group_id:
          type: integer
        name:
          type: string
        subtitle:
          type: string
        priority:
          type: integer
        short_description:
          type: string
        description:
          type: string
        price:
          type: string
          pattern: ^-?\d+\.\d{2}$
          example: '199.00'
          description: Сумма в рублях строкой с двумя знаками (внутри хранится в копейках).
        old_price:
          type: string
          pattern: ^-?\d+\.\d{2}$
          example: '199.00'
          description: С v1.30. Цена до акции
        image_uri:
          type: string
        multiple_of:
          type: number
        mods:
          type: array
          items:
            type: integer
          description: Идентификаторы модификаторов
        allow_to_sell:
          type: boolean
        stores:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              store_id:
                type: integer
              allow_to_sell:
                type: boolean
              price:
                type: string
                pattern: ^-?\d+\.\d{2}$
                example: '199.00'
                description: Сумма в рублях строкой с двумя знаками (внутри хранится в копейках).
              old_price:
                type: string
                pattern: ^-?\d+\.\d{2}$
                example: '199.00'
                description: Сумма в рублях строкой с двумя знаками (внутри хранится в копейках).
        measure_name:
          type: string
          description: С v1.27
        show_price_per_serving:
          type: boolean
          description: С v1.27
        recommended_home:
          type: boolean
          description: С v1.30
        recommended_cart:
          type: boolean
          description: С v1.30
        require_add_to_cart:
          type: boolean
          description: С v1.30
      required:
        - id
        - name
    ProductMod:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        required:
          type: boolean
        quantity_mod: {}
        image_uri:
          type: string
        multiple:
          type: boolean
          description: С v1.26
        details:
          type: array
          items:
            $ref: '#/components/schemas/ProductModDetail'
      required:
        - id
        - name
        - details
    ProductModDetail:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        position:
          type: integer
        quantity_multiplier: {}
        image_uri:
          type: string
        price:
          type: string
          pattern: ^-?\d+\.\d{2}$
