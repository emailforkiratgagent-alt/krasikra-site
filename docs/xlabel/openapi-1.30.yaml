openapi: 3.0.3
info:
  title: XLabel Mobile API
  version: '1.30'
  description: |-
    API мобильных приложений проектов XLabel. Актуальная версия — **1.30** (`latest_api_version` в `config/services.yaml`).

    Подробности (версионирование, авторизация, формат ответов) — в `docs/api/README.md`.

    Документ составлен по исходному коду контроллеров `src/Controller/API/v1` и нормализаторам `src/Serializer/Normalizer`.
servers:
  - url: https://{host}/api/v{version}
    variables:
      host:
        default: example.com
        description: Хост проекта
      version:
        default: '1.30'
        description: Версия API (`major.minor`). Если версию не указать в маршруте, подставляется последняя.
tags:
  - name: Авторизация
  - name: Сервисные
  - name: Профиль
  - name: Адреса и оплата
  - name: Контент
  - name: Подарки (купоны)
  - name: Каталог
  - name: Заказы
  - name: Адреса и геокодинг
  - name: Опросы и оценка чеков
  - name: SMM
paths:
  /token/phone:
    post:
      tags:
        - Авторизация
      summary: Вход по телефону и паролю
      security:
        - appToken: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                phone:
                  type: string
                password:
                  type: string
                  format: password
              required:
                - phone
                - password
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                password:
                  type: string
                  format: password
              required:
                - phone
                - password
      responses:
        '200':
          description: Пара токенов
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    $ref: '#/components/schemas/TokenPair'
                required:
                  - response
        '401':
          description: Неверный логин/пароль, пользователь заблокирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /token/card:
    post:
      tags:
        - Авторизация
      summary: Вход по номеру карты и паролю
      security:
        - appToken: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                card_code:
                  type: integer
                password:
                  type: string
                  format: password
              required:
                - card_code
                - password
          application/json:
            schema:
              type: object
              properties:
                card_code:
                  type: integer
                password:
                  type: string
                  format: password
              required:
                - card_code
                - password
      responses:
        '200':
          description: Пара токенов
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    $ref: '#/components/schemas/TokenPair'
                required:
                  - response
        '401':
          description: Неверный логин/пароль, пользователь заблокирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /token/firebase:
    post:
      tags:
        - Авторизация
      summary: Вход по Firebase ID-токену
      description: Телефон берётся из аккаунта Firebase; новый пользователь регистрируется автоматически.
      security:
        - appToken: []
      parameters:
        - name: hash_code
          in: query
          required: false
          schema:
            type: string
          description: Зашифрованный идентификатор устройства (RSA, base64). Обязателен для методов авторизации и подтверждения телефона начиная с v1.9; также передаётся в теле формы.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                id_token:
                  type: string
              required:
                - id_token
          application/json:
            schema:
              type: object
              properties:
                id_token:
                  type: string
              required:
                - id_token
      responses:
        '200':
          description: Пара токенов
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    $ref: '#/components/schemas/TokenPair'
                required:
                  - response
        '400':
          description: Нет `id_token`, не настроен ключ Firebase, ошибка проверки устройства
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Токен недействителен / пользователь заблокирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Устройство заблокировано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /token/google:
    post:
      tags:
        - Авторизация
      summary: Вход по Google ID-токену
      security:
        - appToken: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                id_token:
                  type: string
              required:
                - id_token
          application/json:
            schema:
              type: object
              properties:
                id_token:
                  type: string
              required:
                - id_token
      responses:
        '200':
          description: Пара токенов
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    $ref: '#/components/schemas/TokenPair'
                required:
                  - response
        '400':
          description: Нет `id_token` / не настроены секреты
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /token/telegram/start:
    post:
      tags:
        - Авторизация
      summary: Начать вход через Telegram
      description: '**Доступно с версии API 1.7** (в более ранних версиях — `404`).'
      security:
        - appToken: []
      parameters:
        - name: hash_code
          in: query
          required: false
          schema:
            type: string
          description: Зашифрованный идентификатор устройства (RSA, base64). Обязателен для методов авторизации и подтверждения телефона начиная с v1.9; также передаётся в теле формы.
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                push_token:
                  type: string
                platform:
                  type: string
                version:
                  type: string
                tester:
                  type: boolean
          application/json:
            schema:
              type: object
              properties:
                push_token:
                  type: string
                platform:
                  type: string
                version:
                  type: string
                tester:
                  type: boolean
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    $ref: '#/components/schemas/MessengerStart'
                required:
                  - response
        '400':
          description: Бот не настроен или ошибка проверки устройства
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Не указан или неверен `X-APP-TOKEN`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /token/telegram:
    post:
      tags:
        - Авторизация
      summary: Завершить вход через Telegram
      description: '**Доступно с версии API 1.7** (в более ранних версиях — `404`).'
      security:
        - appToken: []
      parameters:
        - name: hash_code
          in: query
          required: false
          schema:
            type: string
          description: Зашифрованный идентификатор устройства (RSA, base64). Обязателен для методов авторизации и подтверждения телефона начиная с v1.9; также передаётся в теле формы.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                id_token:
                  type: string
                  description: Токен из `/token/telegram/start`
              required:
                - id_token
          application/json:
            schema:
              type: object
              properties:
                id_token:
                  type: string
                  description: Токен из `/token/telegram/start`
              required:
                - id_token
      responses:
        '200':
          description: Пара токенов
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    $ref: '#/components/schemas/TokenPair'
                required:
                  - response
        '400':
          description: Нет `id_token`/бот не настроен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Токен не найден, просрочен или телефон не подтверждён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /token/max/start:
    post:
      tags:
        - Авторизация
      summary: Начать вход через Max
      description: '**Доступно с версии API 1.7** (в более ранних версиях — `404`).'
      security:
        - appToken: []
      parameters:
        - name: hash_code
          in: query
          required: false
          schema:
            type: string
          description: Зашифрованный идентификатор устройства (RSA, base64). Обязателен для методов авторизации и подтверждения телефона начиная с v1.9; также передаётся в теле формы.
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                push_token:
                  type: string
                platform:
                  type: string
                version:
                  type: string
                tester:
                  type: boolean
          application/json:
            schema:
              type: object
              properties:
                push_token:
                  type: string
                platform:
                  type: string
                version:
                  type: string
                tester:
                  type: boolean
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    $ref: '#/components/schemas/MessengerStart'
                required:
                  - response
        '400':
          description: Бот не настроен или ошибка проверки устройства
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Не указан или неверен `X-APP-TOKEN`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /token/max:
    post:
      tags:
        - Авторизация
      summary: Завершить вход через Max
      description: '**Доступно с версии API 1.7** (в более ранних версиях — `404`).'
      security:
        - appToken: []
      parameters:
        - name: hash_code
          in: query
          required: false
          schema:
            type: string
          description: Зашифрованный идентификатор устройства (RSA, base64). Обязателен для методов авторизации и подтверждения телефона начиная с v1.9; также передаётся в теле формы.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                id_token:
                  type: string
              required:
                - id_token
          application/json:
            schema:
              type: object
              properties:
                id_token:
                  type: string
              required:
                - id_token
      responses:
        '200':
          description: Пара токенов
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    $ref: '#/components/schemas/TokenPair'
                required:
                  - response
        '400':
          description: Нет `id_token`/бот не настроен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Токен не найден, просрочен или телефон не подтверждён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /token/whatsapp/start:
    post:
      tags:
        - Авторизация
      summary: Начать вход через WhatsApp
      description: '**Доступно с версии API 1.30** (в более ранних версиях — `404`).'
      security:
        - appToken: []
      parameters:
        - name: hash_code
          in: query
          required: false
          schema:
            type: string
          description: Зашифрованный идентификатор устройства (RSA, base64). Обязателен для методов авторизации и подтверждения телефона начиная с v1.9; также передаётся в теле формы.
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                push_token:
                  type: string
                platform:
                  type: string
                version:
                  type: string
                tester:
                  type: boolean
          application/json:
            schema:
              type: object
              properties:
                push_token:
                  type: string
                platform:
                  type: string
                version:
                  type: string
                tester:
                  type: boolean
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    $ref: '#/components/schemas/MessengerStart'
                required:
                  - response
        '400':
          description: Бот не настроен или ошибка проверки устройства
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Не указан или неверен `X-APP-TOKEN`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /token/whatsapp:
    post:
      tags:
        - Авторизация
      summary: Завершить вход через WhatsApp
      description: '**Доступно с версии API 1.30** (в более ранних версиях — `404`).'
      security:
        - appToken: []
      parameters:
        - name: hash_code
          in: query
          required: false
          schema:
            type: string
          description: Зашифрованный идентификатор устройства (RSA, base64). Обязателен для методов авторизации и подтверждения телефона начиная с v1.9; также передаётся в теле формы.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                id_token:
                  type: string
              required:
                - id_token
          application/json:
            schema:
              type: object
              properties:
                id_token:
                  type: string
              required:
                - id_token
      responses:
        '200':
          description: Пара токенов
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    $ref: '#/components/schemas/TokenPair'
                required:
                  - response
        '400':
          description: Нет `id_token`/бот не настроен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Токен не найден, просрочен или телефон не подтверждён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /token/otp/request:
    get:
      tags:
        - Авторизация
      summary: URL для запроса одноразового пароля
      description: Возвращает ссылку на страницу запроса OTP (метод принимает любой HTTP-метод).
      security:
        - appToken: []
      parameters:
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum:
              - sms_ru_sms
              - sms_ru_call
          description: Тип OTP
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: string
                required:
                  - response
        '401':
          description: Не указан или неверен `X-APP-TOKEN`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /token/otp/check:
    post:
      tags:
        - Авторизация
      summary: Вход по одноразовому паролю (SMS.ru)
      description: '**Доступно с версии API 1.23** (в более ранних версиях — `404`).'
      security:
        - appToken: []
      parameters:
        - name: hash_code
          in: query
          required: false
          schema:
            type: string
          description: Зашифрованный идентификатор устройства (RSA, base64). Обязателен для методов авторизации и подтверждения телефона начиная с v1.9; также передаётся в теле формы.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                type:
                  type: string
                  enum:
                    - sms_ru_sms
                    - sms_ru_call
                token:
                  type: string
                password:
                  type: string
                  description: Код из SMS (для типа SMS)
              required:
                - type
                - token
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  enum:
                    - sms_ru_sms
                    - sms_ru_call
                token:
                  type: string
                password:
                  type: string
                  description: Код из SMS (для типа SMS)
              required:
                - type
                - token
      responses:
        '200':
          description: Пара токенов
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    $ref: '#/components/schemas/TokenPair'
                required:
                  - response
        '400':
          description: Неверный `type`, нет `token`/`password`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Токен не найден/просрочен, неверный код, номер ещё не подтверждён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /token/refresh:
    post:
      tags:
        - Авторизация
      summary: Обновить access_token
      security:
        - appToken: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
              required:
                - refresh_token
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
              required:
                - refresh_token
      responses:
        '200':
          description: Пара токенов
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    $ref: '#/components/schemas/TokenPair'
                required:
                  - response
        '401':
          description: Токен не найден, пользователь заблокирован/удалён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /versions:
    get:
      tags:
        - Сервисные
      summary: Версии разделов данных
      description: Клиент вызывает при старте/возврате в приложение, сравнивает даты и перезагружает изменившиеся разделы. Для авторизованного пользователя также регистрирует вход и push-токен (если переданы `push_token`, `platform`, `version`).
      security:
        - appToken: []
        - appToken: []
          bearerAuth: []
      parameters:
        - name: platform
          in: query
          required: true
          schema:
            type: string
            enum:
              - android
              - ios
          description: Платформа приложения
        - name: version
          in: query
          required: true
          schema:
            type: string
            pattern: ^\d+\.\d+\.\d+$
          description: Версия приложения X.Y.Z
        - name: hash_code
          in: query
          required: false
          schema:
            type: string
          description: Зашифрованный идентификатор устройства (RSA, base64). Обязателен для методов авторизации и подтверждения телефона начиная с v1.9; также передаётся в теле формы.
        - name: push_token
          in: query
          required: false
          schema:
            type: string
        - name: tester
          in: query
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    $ref: '#/components/schemas/Versions'
                required:
                  - response
        '400':
          description: Ошибка проверки устройства (v1.9+)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Неверный токен / устройство заблокировано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /settings:
    get:
      tags:
        - Сервисные
      summary: Настройки приложения
      description: |-
        Набор полей зависит от версии API (см. описание полей в схеме).

        **Доступно с версии API 1.1** (в более ранних версиях — `404`).
      security:
        - appToken: []
        - appToken: []
          bearerAuth: []
      parameters:
        - name: platform
          in: query
          required: true
          schema:
            type: string
            enum:
              - android
              - ios
          description: Платформа приложения
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    $ref: '#/components/schemas/Settings'
                required:
                  - response
  /push_token:
    post:
      tags:
        - Сервисные
      summary: Зарегистрировать push-токен
      description: 'Алиас: `POST /people/push_token`. Если передан `Authorization`, токен привязывается к пользователю.'
      security:
        - appToken: []
        - appToken: []
          bearerAuth: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                push_token:
                  type: string
                platform:
                  type: string
                version:
                  type: string
                  description: Версия приложения
