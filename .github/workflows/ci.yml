name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: krasikra_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/krasikra_test
      PAYLOAD_SECRET: ci-only-secret-not-used-anywhere-else
      NEXT_PUBLIC_SERVER_URL: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Encryption key for tests
        run: echo "SETTINGS_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generated files are up to date
        run: |
          pnpm run generate:xlabel-types
          pnpm run generate:importmap
          pnpm run generate:types
          pnpm payload migrate:create schema-check --skip-empty --force-accept-warning
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            git --no-pager diff --stat
            echo "::error::Generated files are stale or a migration is missing. Push a commit with [regen] (and [migration:<name>] for schema changes) in its message."
            exit 1
          fi

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test:unit

      - name: Apply migrations to an empty database
        run: pnpm run migrate

      - name: Integration tests (PostgreSQL)
        run: pnpm run test:int

      - name: Build
        run: pnpm run build

      - name: Smoke test of the production server
        run: |
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/
          check() {
            local name="$1"; shift
            (cd .next/standalone && env NODE_ENV=production PORT=8080 HOSTNAME=127.0.0.1 "$@" node server.js > "/tmp/server-$name.log" 2>&1 &)
            for i in $(seq 1 60); do curl -fs http://127.0.0.1:8080/healthz >/dev/null && break; sleep 1; done
          }
          stop() { pkill -f "node server.js" || true; sleep 2; }

          check noindex
          curl -fsS http://127.0.0.1:8080/healthz
          curl -fsSI http://127.0.0.1:8080/ | tee /tmp/home.txt
          grep -qi '^x-robots-tag: noindex' /tmp/home.txt
          curl -fsS http://127.0.0.1:8080/robots.txt | tee /tmp/robots.txt
          grep -q 'Disallow: /' /tmp/robots.txt
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/admin)
          echo "admin: $code"; case "$code" in 200|302|307) ;; *) cat /tmp/server-noindex.log; exit 1;; esac
          curl -fsS http://127.0.0.1:8080/ | grep -q 'Хозяин Камчатки'
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/api/globals/xlabel-integration/check-connection)
          echo "check-connection without login: $code"; [ "$code" = "403" ]
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/globals/xlabel-integration)
          echo "global without login: $code"; [ "$code" = "403" ]
          stop

          check indexed NOINDEX=false
          curl -fsSI http://127.0.0.1:8080/ | tee /tmp/home2.txt
          if grep -qi '^x-robots-tag' /tmp/home2.txt; then echo "X-Robots-Tag must be absent with NOINDEX=false"; exit 1; fi
          stop

      - name: Server logs
        if: failure()
        run: cat /tmp/server-*.log || true

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (linux/amd64, as for Yandex Cloud)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          sbom: false
          tags: krasikra-web:ci
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container starts and answers on PORT
        run: |
          docker run -d --name web -p 8080:8080 \
            -e PAYLOAD_SECRET=ci -e SETTINGS_ENCRYPTION_KEY="$(openssl rand -base64 32)" \
            -e DATABASE_URL=postgres://none:none@127.0.0.1:1/none \
            krasikra-web:ci
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/healthz | grep -q '"status":"ok"'
          curl -fsSI http://127.0.0.1:8080/healthz | grep -qi '^x-robots-tag: noindex'
          docker exec web id -u | grep -qv '^0$'
          docker image inspect krasikra-web:ci --format 'Image size: {{.Size}} bytes'

      - name: Container logs
        if: failure()
        run: docker logs web || true
